<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small driving and typing game, made as a personal experiment." />
    <meta name="theme-color" content="#080c18" />
    <title>itsjustanidea</title>
  </head>
  <body>
    <div id="ui-overlay">
      <div id="mode-label">MODE: CITY (WASD)</div>
      <div id="typing-panel" style="display: none;">
        <div id="prompt-source"></div>
        <div id="target-word"></div>
        <div id="typed-input"></div>
        <div id="stats">WPM: 0 | Accuracy: 100%</div>
      </div>
      <div id="hint">City: WASD | Highway: type (Backspace ok) | Tab: dev mode | F2: cab | F3: camera | R: reset (city) | F4: reset | F6: next act (dev) | F9: mute | Esc: pause | `: debug | drag: look</div>
    </div>
    <div id="speedo">0 km/h</div>
    <div id="pause-overlay" style="display: none;">PAUSED</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
